services:
  rag-api:
    build: .
    container_name: policydecoder-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - /tmp/policydecoder_uploads:/tmp/policydecoder_uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-backend:
    build: ./backend
    container_name: policydecoder-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHON_API_URL=http://rag-api:8000
    depends_on:
      - rag-api
    restart: unless-stopped
